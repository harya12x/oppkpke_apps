name: Deploy to VPS

on:
  push:
    branches:
      - main

# Serialisasi deploy: hanya satu deploy jalan pada satu waktu. Push baru
# tidak dibatalkan di tengah (cancel-in-progress: false) supaya build image +
# migrate + swap tidak terpotong; ia mengantre sampai deploy sebelumnya selesai.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Kalau SSH/docker build nyangkut, job dibunuh di 15 menit — runner dilepas,
    # tidak menggantung memakai slot runner berjam-jam (default 6 jam).
    timeout-minutes: 15

    steps:
      # Kegagalan "ssh: handshake failed ... [none publickey]" hampir selalu
      # bersumber dari bentuk secret yang salah (public key tertukar dengan
      # private key, atau tersalin sebagian), bukan dari server. Langkah ini
      # memeriksa bentuknya lebih dulu dan menjelaskan persis apa yang salah.
      # Isi kunci tidak pernah dicetak.
      - name: Periksa secret SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          gagal=0
          [ -n "$SSH_HOST" ] || { echo "::error::Secret SSH_HOST belum diisi."; gagal=1; }
          [ -n "$SSH_USER" ] || { echo "::error::Secret SSH_USER belum diisi."; gagal=1; }

          if [ -z "$SSH_KEY" ]; then
            echo "::error::Secret SSH_KEY belum diisi."
            gagal=1
          else
            baris=$(echo "$SSH_KEY" | wc -l)
            awal=$(echo "$SSH_KEY" | head -1)
            case "$awal" in
              *"BEGIN OPENSSH PRIVATE KEY"*|*"BEGIN RSA PRIVATE KEY"*|*"BEGIN EC PRIVATE KEY"*|*"BEGIN PRIVATE KEY"*)
                echo "SSH_KEY terbaca sebagai private key ($baris baris)." ;;
              ssh-rsa*|ssh-ed25519*|ecdsa-*)
                echo "::error::SSH_KEY berisi PUBLIC key (isi berkas .pub). Yang diperlukan PRIVATE key - berkas tanpa akhiran .pub."
                gagal=1 ;;
              PuTTY*)
                echo "::error::SSH_KEY berformat PuTTY (.ppk) yang tidak didukung. Ekspor ke format OpenSSH lebih dulu."
                gagal=1 ;;
              *)
                echo "::error::SSH_KEY tidak diawali baris '-----BEGIN ... PRIVATE KEY-----'. Salin ulang SELURUH isi berkas private key."
                gagal=1 ;;
            esac

            if [ "$baris" -lt 4 ]; then
              echo "::error::SSH_KEY hanya $baris baris - kemungkinan tersalin sebagian atau baris barunya hilang saat menempel."
              gagal=1
            fi
          fi

          if [ "$gagal" -ne 0 ]; then
            echo "::notice::Panduan perbaikan ada di docs/SETUP-VPS.md bagian 'Deploy GitHub gagal: ssh handshake failed'."
            exit 1
          fi
          echo "Secret lengkap - lanjut menyambung ke VPS."

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # Isi secret SSH_PORT hanya bila port SSH server bukan 22.
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /var/www/oppkpke_apps

            echo "========================================"
            echo "🚀 Memulai proses deploy..."
            echo "========================================"

            # ----------------------------------------
            # STEP 0: Izinkan git bekerja di direktori ini
            # ----------------------------------------
            git config --global --add safe.directory /var/www/oppkpke_apps

            # ----------------------------------------
            # STEP 1: Sinkronkan kode
            # ----------------------------------------
            echo "📥 Sinkronkan kode dari GitHub..."
            BEFORE=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main
            AFTER=$(git rev-parse HEAD)

            if [ "$BEFORE" = "$AFTER" ]; then
              echo "ℹ️  Tidak ada commit baru ($AFTER), lanjut rebuild cache saja."
            else
              echo "✅ Update: $BEFORE -> $AFTER"
            fi

            # ----------------------------------------
            # STEP 2: Build image baru & swap container
            # ----------------------------------------
            echo "🔨 Build image baru... (server lama tetap jalan selama build)"
            docker compose build app

            # ----------------------------------------
            # STEP 2b: Sinkronkan hasil build Vite ke host
            # ----------------------------------------
            echo "📦 Sinkronkan asset build (Vite) dari image ke host..."
            rm -rf public/build
            CID=$(docker create oppkpke_apps-app:latest)
            docker cp "$CID":/var/www/public/build ./public/build
            docker rm "$CID" > /dev/null

            echo "📣 Sinyal queue:restart supaya worker lama selesai job..."
            docker compose exec -T app php artisan queue:restart || true

            echo "⚡ Swap ke container baru (downtime < 1 detik)..."
            # app, worker, scheduler memakai image yang sama → semuanya di-recreate
            # agar memakai kode baru. db & nginx tidak disentuh (image tetap).
            docker compose up -d --no-deps app worker scheduler

            # ----------------------------------------
            # STEP 3: Post-deploy artisan commands
            # ----------------------------------------
            echo "⏳ Tunggu container & network siap..."
            sleep 10

            echo "🧹 Refresh package manifest & bersihkan cache lama..."
            docker compose exec -T app php artisan optimize:clear

            # Migrasi berjalan bila ada tabel/kolom baru. Migration dibuat idempotent
            # (guard Schema::hasTable) sehingga tabel yang sudah ada tidak menyebabkan
            # "already exists". 'timeout 120s' mencegah gantung bila DB lock.
            echo "🗄️  Jalankan migrasi database..."
            if ! docker compose exec -T app timeout 120s php artisan migrate --force; then
              echo "❌ Migrasi GAGAL — deploy dihentikan sebelum optimize agar skema DB tidak setengah jalan."
              echo "   Periksa migration yang belum idempotent atau tabel/kolom yang bentrok."
              exit 1
            fi

            echo "🔗 Buat storage symlink..."
            docker compose exec -T app php artisan storage:link || true

            echo "📦 Daftarkan ulang package & bangun cache baru..."
            docker compose exec -T app php artisan package:discover --ansi
            docker compose exec -T app php artisan optimize

            # ----------------------------------------
            # STEP 3b: Pastikan storage & cache writable oleh www-data
            # ----------------------------------------
            echo "🔐 Perbaiki kepemilikan storage & bootstrap/cache..."
            docker compose exec -T app chown -R www-data:www-data storage bootstrap/cache
            docker compose exec -T app chmod -R 775 storage bootstrap/cache

            # ----------------------------------------
            # STEP 3c: Reload nginx
            # ----------------------------------------
            echo "🔁 Reload konfigurasi nginx..."
            docker compose exec -T nginx nginx -t && docker compose exec -T nginx nginx -s reload || true

            # ----------------------------------------
            # STEP 4: Verifikasi deploy berhasil
            # ----------------------------------------
            echo "🔍 Verifikasi container berjalan..."
            docker compose ps

            echo "========================================"
            echo "✅ Deploy selesai tanpa downtime!"
            echo "========================================"