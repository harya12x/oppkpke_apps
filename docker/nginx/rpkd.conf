# =============================================================================
# Situs rpkdkabkotabaru.id untuk Nginx edge BERSAMA vps1.
#
# File ini disalin ke conf.d edge oleh vps1-edge.sh (repo PMB), bukan dipakai
# container project "rpkd". Edge bergabung ke jaringan rpkd_edge sehingga alias
# rpkd-app-blue/rpkd-app-green bisa di-resolve lewat DNS Docker.
#
# Path di dalam container edge (semua read-only):
#   /etc/nginx/rpkd/active.conf              map $host $rpkd_color { default green; }
#   /etc/nginx/edge/cloudflare-realip.conf   set_real_ip_from <rentang Cloudflare>;
#   /etc/nginx/tls/rpkd/origin.pem, origin.key, aop-ca.pem
#   /srv/rpkd/public/{blue,green}/           aset publik dari image (per warna)
#
# Tidak ada folder unggahan publik: lampiran chat dan file import ada di disk
# privat Laravel (storage/app/private) dan hanya diunduh lewat route berotorisasi.
# Nama variabel dan zona diawali "rpkd_" supaya tidak bentrok dengan situs lain.
# =============================================================================

include /etc/nginx/rpkd/active.conf;

# www -> domain utama (sertifikat origin Cloudflare mencakup keduanya).
server {
    listen 8443 ssl;
    listen 9443 ssl;
    http2 on;
    server_name www.rpkdkabkotabaru.id;

    ssl_certificate     /etc/nginx/tls/rpkd/origin.pem;
    ssl_certificate_key /etc/nginx/tls/rpkd/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://rpkdkabkotabaru.id$request_uri;
}

server {
    listen 8443 ssl;
    # Port UJI: hanya di 127.0.0.1 host, lewat tunnel SSH, SEBELUM DNS dipindah.
    # Tanpa AOP (browser tidak punya sertifikat klien Cloudflare).
    listen 9443 ssl;
    http2 on;
    server_name rpkdkabkotabaru.id;

    ssl_certificate     /etc/nginx/tls/rpkd/origin.pem;
    ssl_certificate_key /etc/nginx/tls/rpkd/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:rpkd_ssl:10m;
    ssl_session_timeout 1h;

    # Authenticated Origin Pulls: hanya Cloudflare yang boleh berbicara dengan origin.
    ssl_client_certificate /etc/nginx/tls/rpkd/aop-ca.pem;
    ssl_verify_client optional;
    set $rpkd_aop_ok 0;
    if ($ssl_client_verify = SUCCESS) { set $rpkd_aop_ok 1; }
    if ($server_port = 9443)          { set $rpkd_aop_ok 1; }
    if ($rpkd_aop_ok = 0)             { return 403; }

    # IP asli pengunjung dari header Cloudflare: REMOTE_ADDR yang diterima Laravel
    # (throttle login, audit log, daftar sesi) berisi IP ini.
    include /etc/nginx/edge/cloudflare-realip.conf;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    set $rpkd_root /srv/rpkd/public/$rpkd_color;
    set $rpkd_fpm  rpkd-app-$rpkd_color:9000;   # alias jaringan, lihat compose.yaml
    root $rpkd_root;
    index index.php;
    charset utf-8;

    access_log /dev/stdout edge;
    client_max_body_size 25m;            # = post_max_size di docker/php/php.ini
    client_body_timeout 120s;

    # Header keamanan. CSP dikirim aplikasi (App\Http\Middleware\SecurityHeaders).
    # Location yang punya add_header sendiri TIDAK mewarisi baris ini.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /up { return 404; }
    location ^~ /_internal/ { return 404; }
    # Disk "public" Laravel tidak dipakai aplikasi ini.
    location ^~ /storage/ { return 404; }

    location ~ /\.(?!well-known/) { return 404; }
    location ~* \.(?:bak|old|orig|swp|sql|log|ini|env|sh|git|bat|md|lock)$ { return 404; }

    # --- Aset statis dari image (per warna) ----------------------------------
    location ^~ /build/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }
    location ~* \.(?:css|js|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot|otf)$ {
        try_files $uri =404;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # --- Aplikasi ----------------------------------------------------------------
    location / {
        try_files $uri /index.php?$query_string;
    }

    # Hanya front controller yang dieksekusi.
    location = /index.php {
        internal;
        fastcgi_pass $rpkd_fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
        # Dipasang di atas oleh Nginx; versi aplikasi disembunyikan supaya tidak ganda.
        fastcgi_hide_header X-Frame-Options;
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header Strict-Transport-Security;
        fastcgi_hide_header Referrer-Policy;
        fastcgi_read_timeout 310s;           # import Excel: max_execution_time 300 + jeda
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
    }
    location ~ \.php$ { return 404; }

    location = /favicon.ico { access_log off; log_not_found off; try_files $uri =404; }
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri =404; }
}

# -----------------------------------------------------------------------------
# Server internal RPKD: hanya dari dalam container edge (tidak dipublikasikan).
#   docker exec edge-nginx-1 wget -qO- http://127.0.0.1:8083/up/green
# -----------------------------------------------------------------------------
server {
    listen 127.0.0.1:8083;
    access_log off;

    location = /warna { default_type text/plain; return 200 "$rpkd_color\n"; }

    location ~ ^/up/(?<rpkd_warna>blue|green)$ {
        fastcgi_pass rpkd-app-$rpkd_warna:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param REQUEST_URI     /up;
        fastcgi_param QUERY_STRING    "";
        fastcgi_param SERVER_NAME     rpkdkabkotabaru.id;
        fastcgi_param HTTP_HOST       rpkdkabkotabaru.id;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 10s;
    }

    location / { return 404; }
}
