; =============================================================================
; Pool PHP-FPM RPKD / OPPKPKE (override pool [www] bawaan image)
; =============================================================================
[www]
; Didengar di semua interface DI DALAM container. Port 9000 tidak pernah
; dipublikasikan ke host; hanya Nginx edge di jaringan rpkd_edge yang menjangkaunya.
listen = 9000

; Pengguna: operator perangkat daerah Kotabaru (puluhan, bukan ribuan).
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

ping.path = /ping
ping.response = pong
pm.status_path = /fpm-status

; Import Excel dan ekspor PDF bisa lama.
request_terminate_timeout = 310s

catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

security.limit_extensions = .php

; Variabel environment container diteruskan ke PHP. Secret TIDAK lewat
; environment; Laravel membacanya dari file .env yang di-mount.
clear_env = no
