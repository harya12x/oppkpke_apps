; =============================================================================
; Override php.ini untuk RPKD / OPPKPKE (dibaca setelah php.ini-production)
; =============================================================================
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
html_errors = Off

; Import Excel (phpspreadsheet) dan PDF (dompdf) berat di memori.
max_execution_time = 300
max_input_time = 300
memory_limit = 1024M

; Unggahan: file import Excel/CSV dan lampiran chat (validasi aplikasi: import maks 20 MB, lampiran 5 MB).
; Samakan dengan client_max_body_size di docker/nginx/rpkd.conf.
upload_max_filesize = 22M
post_max_size = 25M
max_file_uploads = 20
; Halaman pagu / laporan mengirim banyak baris sekaligus.
max_input_vars = 10000

session.cookie_httponly = 1
session.use_strict_mode = 1

; config/app.php memakai UTC dan Laravel menimpa nilai ini; disamakan supaya tidak membingungkan.
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600
