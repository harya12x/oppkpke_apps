# =============================================================================
# Konfigurasi vps1-cd untuk RPKD Kotabaru (OPPKPKE). Dipasang ke
# /etc/vps1-cd/apps/rpkd.conf oleh vps1-rpkd-siapkan.sh. Dibaca (source) oleh
# /usr/local/sbin/vps1-cd.
# =============================================================================
APP=rpkd
NAMA=RPKD

# Image dari CI (repo pribadi harya12x/oppkpke_apps). vps1-cd HANYA menarik tag
# "rilis" (semua job CI hijau).
IMAGE_GHCR=ghcr.io/harya12x/rpkd-php
IMAGE_LOKAL=rpkd-php

DEPLOY=/usr/local/sbin/rpkd-deploy
TARIK=/opt/rpkd/src/docker/host/vps1-rpkd-tarik-image.sh
ACTIVE_CONF=/srv/rpkd/nginx/active.conf
CONTAINER_POLA=rpkd-app-%s-1

# MIGRASI sengaja kosong: skema RPKD dikelola migration Laravel, dijalankan
# rpkd-deploy sendiri (PRA_DEPLOY=rpkd-migrasi: dump database lalu
# php artisan migrate --force) sebelum warna baru dinyalakan.
MIGRASI=

RIWAYAT_DI_IMAGE=/var/www/html/.rilis/commit.txt

UJI_ASAP=/usr/local/sbin/rpkd-uji-asap
HOST_LOG=rpkdkabkotabaru.id
PANTAU_MENIT=5
BATAS_5XX=10
BATAS_5XX_PERSEN=5

PERSETUJUAN=telegram
KEDALUWARSA_JAM=24

FREEZE=/etc/vps1-cd/apps/rpkd.freeze
